# 呆呆机器人配置文件示例

server:
  port: 8080

qq:
  enabled: true
  app_id: "YOUR_QQ_APP_ID"
  secret: "YOUR_QQ_APP_SECRET"
  owner_openid: "YOUR_QQ_OPENID"
  collaborators: []

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model: "deepseek-chat"
  vision:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: ""
    model: ""
  embedding:
    base_url: "https://api.siliconflow.cn/v1"
    api_key: "YOUR_EMBEDDING_API_KEY"
    model: "BAAI/bge-m3"

agent:
  max_concurrent: 1
  runners:
    - name: "agy"
      description: "Google Antigravity 自驱智能体沙箱，具备完整的代码库检索、文件编辑、终端执行与自省反思能力"
      command: "agy"
      default_dir: "data/workspace/sandbox"

plugins:
  nixsearch:
    enabled: true

memory:
  working_limit: 30
