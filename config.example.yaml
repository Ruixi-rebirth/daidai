# 呆呆机器人配置文件示例

server:
  port: 8080

qq:
  enabled: true
  app_id: "YOUR_QQ_APP_ID"
  secret: "YOUR_QQ_APP_SECRET"
  owner_openid: "YOUR_QQ_OPENID"
  collaborators: [] # 首次启动时导入数据库；之后通过 QQ 私聊自然语言管理协作者

telegram:
  enabled: false
  token: "YOUR_TELEGRAM_BOT_TOKEN"
  owner_username: "YOUR_TELEGRAM_USERNAME" # 每条消息按 Telegram 用户名核对，不区分大小写，可带 @ 前缀

llm:
  # 按顺序尝试的 OpenAI 兼容对话兜底链（位于 AGY 之后；排在前面的免费模型优先，后面的作为最终兜底）
  fallbacks:
    - name: "GLM"
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      api_key: "YOUR_ZHIPU_API_KEY"
      model: "glm-4.7-flash"
    - name: "DeepSeek"
      base_url: "https://api.deepseek.com/v1"
      api_key: "YOUR_DEEPSEEK_API_KEY"
      model: "deepseek-chat"
  # 可选：纯文生图备用 API（兼容 /images/generations，如智谱 cogview-3-flash、硅基流动 Kolors 等）
  image_fallback:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key: "YOUR_ZHIPU_API_KEY"
    model: "cogview-3-flash"
  embedding:
    base_url: "https://api.siliconflow.cn/v1"
    api_key: "YOUR_EMBEDDING_API_KEY"
    model: "BAAI/bge-m3"

agent:
  max_concurrent: 1
  execution_timeout: 30m # 每张工单最长执行时间；设为 0 时仅由 /stop 或服务停机取消
  runners:
    - name: "agy"
      description: "Google Antigravity 工程执行器，可在所选工作目录中检索代码、编辑文件并运行命令；不提供操作系统级隔离"
      # 此命令也供 AGY 模型、OAuth、视觉、网页检索和生图工具共用。
      command: "agy" # 相对路径以服务启动目录为基准
      default_dir: "data/workspace/sandbox"

briefing:
  enabled: true # 工具与调度可用；收件人需在搭档私聊自然语言订阅，默认无人订阅
  timezone: "Asia/Singapore"
  time: "08:00"
  github_token: "" # 可选，提高 GitHub API 配额；使用现有秘密管理保存

oci:
  enabled: false
  private_key: ""
  user_ocid: ""
  tenancy_ocid: ""
  region: ""
  compartment_id: ""
  daily_report_hour: 8
  daily_report_minute: 30
  cost_alert_delta: 1.0
  timezone: "Asia/Singapore"

cloudflare:
  api_token: "" # Cloudflare API Token（需具备区域 DNS 编辑权限）
  zone: "ruixi2fp.top" # 域名区域，留空则自动从 sync_record 推断
  sync_record: "vps.ruixi2fp.top" # OCI 换绑 IP 后自动同步更新的 A 记录域名
