# 呆呆机器人配置文件示例

server:
  port: 8080

qq:
  enabled: true
  app_id: "YOUR_QQ_APP_ID"
  secret: "YOUR_QQ_APP_SECRET"
  owner_openid: "YOUR_QQ_OPENID"
  collaborators: []

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "YOUR_DEEPSEEK_API_KEY"
  model: "deepseek-chat"
  vision:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key: ""
    model: ""
  embedding:
    base_url: "https://api.siliconflow.cn/v1"
    api_key: "YOUR_EMBEDDING_API_KEY"
    model: "BAAI/bge-m3"

agent:
  max_concurrent: 1
  execution_timeout: 30m # 每张工单最长执行时间；设为 0 时仅由 /stop 或服务停机取消
  runners:
    - name: "agy"
      description: "Google Antigravity 工程执行器，可在所选工作目录中检索代码、编辑文件并运行命令；不提供操作系统级隔离"
      # 此命令也供 AGY 模型、OAuth、视觉、网页检索和生图工具共用。
      command: "agy"
      default_dir: "data/workspace/sandbox"

plugins:
  nixsearch:
    enabled: true

memory:
  working_limit: 30

oci:
  enabled: false
  private_key: ""
  user_ocid: ""
  tenancy_ocid: ""
  region: ""
  compartment_id: ""
  daily_report_hour: 8
  daily_report_minute: 30
  cost_alert_delta: 1.0
  timezone: "Asia/Singapore"
